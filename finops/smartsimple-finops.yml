meters:
- name: platform_subscription
  description: Annual SmartSimple Cloud subscription, scaled by internal users, usage hours, external users, and hosting model.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - hosting_model
- name: internal_users
  description: Licensed internal staff users on the instance.
  unit: users
  aggregation: max
  dimensions:
  - account
- name: usage_hours
  description: Monthly hours users spend in the system, a subscription scaling factor.
  unit: hours
  aggregation: sum
  dimensions:
  - account
- name: implementation_services
  description: One-time and ongoing configuration, integration, migration, training, and premium support.
  unit: project
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track the subscription fee and its scaling factors (internal users, usage hours, external users, hosting model) plus add-on and services spend.
- name: Allocation
  description: Map the single platform subscription to the programs and teams that use it; there are no per-call API charges to allocate.
- name: Optimization
  description: Right-size user counts and hosting tier; keep SmartConnect integrations within the documented per-instance call ceiling rather than pursuing high-volume export.
- name: Accountability
  description: Assign an owner for the SmartSimple contract; review subscription scaling factors and add-ons against budget at renewal.
