description: >-
  FinOps view of SmartSimple spend. SmartSimple Cloud is a contract-based
  enterprise SaaS subscription rather than a usage-metered API. The dominant
  cost is the annual platform subscription, scaled by internal users, monthly
  usage hours, external users, and hosting model, plus optional add-ons (High
  Performance Private Cloud, AI features) and one-time implementation and
  services. The SmartConnect, OData, and SOAP APIs are included with the
  subscription and are not billed per call, so API cost management is about
  staying within the platform agreement and the documented per-instance call
  ceiling rather than metering per-request spend.
notes: >-
  Per-unit rates are not published; SmartSimple pricing is contact-sales.
  Verify current subscription terms, hosting fees, and add-on pricing with
  SmartSimple during reconciliation.
