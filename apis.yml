name: SmartSimple
kind: company
description: SmartSimple Software builds SmartSimple Cloud, a configurable
  cloud platform for grants management, research and government funding
  administration, corporate social responsibility (CSR), scholarships, and
  case management. The platform exposes three documented programmatic
  interfaces on each client instance - SmartConnect (a JSON-based RESTful
  API), an OData reporting API, and a legacy SOAP Web Services API - covering
  records (UTA Level 1/2/3), users, organizations, transactions, custom
  fields, and files. Access is instance-scoped - every customer runs on their
  own alias.smartsimple.com tenant and provisions an API user account or
  access token, so the documented endpoints are modeled against a customer
  instance rather than a single public gateway.
